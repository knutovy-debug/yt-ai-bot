<!DOCTYPE html>
<html>
<head>
  <title>Тест AI</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 50px auto; }
    textarea { width: 100%; padding: 10px; }
    button { padding: 10px 30px; background: #007bff; color: white; border: none; cursor: pointer; }
    #result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>🤖 Тест AI</h1>
  <p>Введи комментарий и получи ответ от DeepSeek</p>
  
  <textarea id="comment" rows="4" placeholder="Напиши комментарий...">Какой у тебя микрофон?</textarea>
  <br><br>
  <button onclick="testAI()">Получить ответ</button>
  
  <div id="result">Ответ появится здесь...</div>

  <script>
    async function testAI() {
      const comment = document.getElementById('comment').value;
      const result = document.getElementById('result');
      result.innerHTML = '⏳ Думаю...';
      
      try {
        const response = await fetch('/api/process-comment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            commentText: comment,
            channelName: 'Тестовый канал',
            tone: 'дружелюбный'
          })
        });
        const data = await response.json();
        result.innerHTML = '<strong>Ответ:</strong><br>' + (data.reply || 'Ошибка: ' + data.error);
      } catch (error) {
        result.innerHTML = '❌ Ошибка: ' + error.message;
      }
    }
  </script>
</body>
</html>
